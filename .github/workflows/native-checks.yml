name: Tinglan Linux GTK builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Linux plugin IDs (comma-separated, all, or empty for none)'
        type: string
        default: all

permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Build gate
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      TINGLAN_PLUGINS: ${{ github.event_name == 'push' && 'all' || inputs.plugins }}
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Test model and build Linux binary
        working-directory: native
        run: |
          go test ./cmd/music ./internal/lyrics ./internal/plugin ./internal/storage ./internal/webauth -timeout 180s
          mkdir -p ../out/native
          go build -trimpath -ldflags='-s -w' -o ../out/native/tinglan ./cmd/music
      - name: Test release version calculation
        run: bash native/scripts/test-release-version.sh
      - name: Calculate release version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          version=$(bash native/scripts/release-version.sh)
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install Linux packaging tools
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio squashfs-tools desktop-file-utils file
      - name: Fetch and verify AppImage tooling
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/appimage-runtime" https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          (cd "$RUNNER_TEMP" && printf '%s\n' \
            'e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  appimagetool' \
            '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  appimage-runtime' | sha256sum --check)
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build and verify deb, rpm and AppImage
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage-runtime" \
            bash native/scripts/package-linux.sh out/native/tinglan "$VERSION" release/native/linux-x64
      - name: Build and verify selected Linux plugins
        if: github.event_name != 'pull_request' && env.TINGLAN_PLUGINS != ''
        working-directory: native
        run: |
          go run ./cmd/tinglan-tool plugins
          cd ../release/plugins
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tinglan-linux-x64
          path: release/native/linux-x64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && env.TINGLAN_PLUGINS != ''
        with:
          name: tinglan-linux-x64-plugins
          path: release/plugins/*
          if-no-files-found: error

  publish:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tinglan-linux-x64
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: tinglan-linux-x64-plugins
          path: plugins
      - name: Verify and publish immutable Linux build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd packages && sha256sum --check SHA256SUMS)
          (cd plugins && sha256sum --check SHA256SUMS)
          mkdir release-assets
          cp "packages/tinglan_${VERSION}-1_amd64.deb" "packages/tinglan-${VERSION}-1.x86_64.rpm" \
            "packages/tinglan-${VERSION}-x86_64.AppImage" plugins/*.zip release-assets/
          (cd release-assets && sha256sum -- *.deb *.rpm *.AppImage *.zip > SHA256SUMS)
          gh release create "v${VERSION}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --latest \
            --title "听澜 Tinglan ${VERSION} · Linux" \
            --notes '未签名、非官方 Linux x86_64 构建。OAuth 身份不属于本项目。AppImage 仍需要系统 Python 3、PyGObject、GTK4 和 libadwaita ≥ 1.6；音源插件单独安装。'
